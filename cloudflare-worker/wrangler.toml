name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "your-database-id-here"

[vars]
# Default admin password hash or key can be set here or via `wrangler secret put ADMIN_PASSWORD`
CORS_ORIGIN = "*"
